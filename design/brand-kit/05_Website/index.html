const BASE=JSON.parse(document.getElementById('initial-data').textContent), KEY='voltoshare-design-v2';

let mapMode=matchMedia('(max-width:639px)').matches?'list':'map',selectedCharger='C01',bookingDate='2026-11-17',bookingStart='18:00',bookingEnd='20:00',bookingVehicle='city',showFuture=false,draft=null,toastTimer;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'CHF '+(n/100).toFixed(2), own=b=>b.household==='A-12', live=b=>['active','upcoming'].includes(b.status), overlap=(a,b,c,d)=>new Date(a)<new Date(d)&&new Date(c)<new Date(b);
const dateFmt=iso=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',day:'numeric',month:'short'}).format(new Date(iso)),timeFmt=iso=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',hour:'2-digit',minute:'2-digit'}).format(new Date(iso));
const route=()=>location.hash.replace(/^#/,'')||'/',go=r=>{if(route()===r)render();else location.hash=r},persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}},toast=s=>{$('#toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',4500)};
const iconLogo=()=>'<img src="../02_Logos/voltoshare-logo-navigation.png" alt="VoltoShare">',chip=(s,key)=>`<span class="chip ${key||s.toLowerCase()}">${esc(s)}</span>`,btn=(text,action,cls='')=>`<button type="button" class="btn ${cls}" data-action="${action}">${text}</button>`;
function publicHeader(){return `<header class="public-header"><div class="shell header-inner"><a class="brand" href="#/" aria-label="VoltoShare home">${iconLogo()}</a><nav aria-label="Main navigation"><a class="hide-tablet" href="#/how-it-works">How it works</a><a class="hide-mobile" href="#/business-model">Business model</a><a class="hide-tablet" href="#/for-buildings">For buildings</a><a class="hide-mobile" href="#/faq">FAQ</a><a class="btn secondary small" href="#/app">Resident demo</a><a class="btn contact small" href="#/contact">Discuss your building</a></nav></div></header>`}
function footer(){return `<footer class="footer"><div class="shell"><span>VoltoShare / Shared charging for apartment buildings</span><span><a href="implementation-guide.html">Implementation guide</a> &nbsp; / &nbsp; <a href="#/business-model">Business model</a></span></div></footer>`}
function home(){return `${publicHeader()}<main id="main-content"><section class="shell hero"><div><div class="eyebrow">Shared charging for apartment buildings</div><h1>Shared charging.<br><span>Built for your building.</span></h1><p>Charging access without an individual wallbox. VoltoShare brings shared infrastructure and simple reservations to residential garages.</p><div class="actions"><a class="btn" href="#/contact">Discuss your building</a><a class="btn secondary" href="#/app">Explore resident demo</a></div></div><div class="hero-visual"><img src="../03_Images/voltoshare-charger-garage.jpg" alt="VoltoShare wallbox concept in an apartment building garage"><div class="caption">VoltoShare charging concept / Supplied visual</div></div></section><div class="shell"><div class="facts"><div class="fact"><strong>20</strong><span>Apartments</span></div><div class="fact"><strong>5</strong><span>Shared charging points</span></div><div class="fact"><strong>20</strong><span>Apartment subscriptions</span></div></div><p class="caption">Proposal example at full occupancy. Subscriptions are per apartment. This is an illustrative configuration.</p><section class="section" id="how-it-works"><div class="section-heading"><div class="eyebrow">For residents</div><h2>Everyday charging, clearly organised</h2></div><div class="steps"><article class="step"><span class="number">01</span><h3>Find a charger</h3><p>Check charger status and upcoming bookings in your building's parking map or list.</p></article><article class="step"><span class="number">02</span><h3>Reserve a time</h3><p>Choose a shared charger, a time slot and one of your household's registered vehicles.</p></article><article class="step"><span class="number">03</span><h3>Track your costs</h3><p>See measured energy, charging history and invoices together in your resident account.</p></article></div></section></div><section class="dark-band"><div class="shell section split"><div><div class="eyebrow">One building service</div><h2>Infrastructure and access, managed together</h2><p>VoltoShare finances, installs and operates shared chargers. Residents access supported chargers through the app or an NFC card.</p><a class="btn secondary" href="#/business-model">Explore the business model</a></div><div><img src="../03_Images/voltoshare-nfc-card.jpg" alt="VoltoShare NFC access card concept"><div class="caption" style="color:#CFD5D0">NFC access card / Supplied concept visual</div></div></div></section><div class="shell"><section class="section audiences" id="for-buildings"><article><div class="eyebrow">Property owners</div><h2>Shared infrastructure for your residents</h2><p>Low or potentially zero upfront payment, depending on the building. A recurring apartment subscription funds the infrastructure and platform.</p><a class="btn" href="#/contact">Discuss your building</a></article><article><div class="eyebrow">Residents</div><h2>Your household, your charging overview</h2><p>Register vehicles, manage bookings and understand electricity costs. Every household uses the same clear building schedule.</p><a class="btn secondary" href="#/app">Open resident demo</a></article></section><section class="section faq" id="faq"><div class="section-heading"><div class="eyebrow">Questions</div><h2>How shared charging works</h2></div><details><summary>Does each apartment need its own wallbox?</summary><p>The proposal uses shared charging points that residents reserve. The appropriate number of points depends on demand, building capacity and installation feasibility.</p></details><details><summary>Who pays for the infrastructure?</summary><p>The landlord or property manager pays VoltoShare a monthly subscription per billable apartment. Residents separately pay for their measured electricity at a dynamic tariff plus the provider markup.</p></details><details><summary>Is the charging price fixed when I reserve?</summary><p>No. A reservation holds a time slot. The indicative rate can change; final energy charges follow measured use and the applicable tariff intervals.</p></details><details><summary>What happens when an apartment is empty?</summary><p>The proposal leaves vacancy billing open. Subscriptions could continue for contracted apartments or pause for vacant ones. The agreement must define this allocation.</p></details><details><summary>Can I try the resident experience?</summary><p>Yes. The resident demo uses fictional data. It does not reserve physical chargers, authenticate residents or process payments.</p><div class="actions" style="margin-top:18px"><a class="btn" href="#/app">Explore the demo</a></div></details></section></div></main>${footer()}`}
function business(){return `${publicHeader()}<main id="main-content" class="shell"><div class="page-intro"><div class="eyebrow">The business model</div><h1>Shared infrastructure.<br>Clear responsibilities.</h1><p>The building subscription and residents' electricity payments fund different parts of the service.</p></div><section class="money-rows"><article class="money-row"><div class="eyebrow">Property owner or manager</div><h3>Apartment subscription</h3><p>Pays monthly per billable apartment for infrastructure, the platform and building service.</p></article><article class="money-row"><div class="eyebrow">Resident</div><h3>Measured electricity</h3><p>Pays for metered consumption at a dynamic energy tariff plus the provider markup.</p></article><article class="money-row"><div class="eyebrow">VoltoShare</div><h3>Shared operation</h3><p>Finances and operates the hardware, installation, software and ongoing maintenance.</p></article></section><section class="calculator"><div class="eyebrow">Illustrative revenue explainer</div><h3 style="margin-top:12px">What changes with vacancy?</h3><p class="muted">Enter an assumed apartment subscription. No commercial rate has been set in the proposal.</p><div class="grid"><label class="form-field">Contracted apartments<input id="units" type="number" min="0" step="1" value="20"></label><label class="form-field">Occupied apartments<input id="occupied" type="number" min="0" step="1" value="18"></label><label class="form-field">CHF per apartment per month<input id="rate" type="number" min="0" step="0.01" placeholder="Enter an assumption"></label></div><label class="form-field" style="max-width:450px">Vacancy billing scenario<select id="vacancy"><option value="continue">Subscription continues for vacant apartments</option><option value="pause">Subscription pauses for vacant apartments</option></select></label><div id="calc-result" class="calc-result" aria-live="polite"><p class="muted">Enter a rate to see illustrative monthly subscription revenue.</p></div><p class="source-note">18 occupied apartments is a scenario assumption. This calculation shows subscription revenue before hardware, installation, financing and operating costs. Vacancy billing remains an open decision.</p></section><section class="section audiences"><article><div class="eyebrow">Economic benefit</div><h2>Fixed costs shared across households</h2><p>Sharing reduces equipment requirements relative to a dedicated point for every apartment. Building demand and installation costs determine whether the model is viable.</p></article><article><div class="eyebrow">Service tradeoff</div><h2>Availability needs coordination</h2><p>Residents may need to wait, reserve a later slot or move their vehicle after charging. Capacity planning and clear building rules matter.</p></article></section><p class="source-note" style="margin:0 0 40px">Source: VoltoShare project proposal, 15 October 2026, page 1. The sample configuration and all financial inputs are illustrative.</p></main>${footer()}`}
function contact(){return `${publicHeader()}<main id="main-content" class="shell"><div class="page-intro"><div class="eyebrow">For property owners</div><h1>Discuss your building</h1><p>Tell us about the building and its residents' charging needs.</p></div><div class="contact-layout"><div class="notice" style="margin-bottom:28px">Demo form. No message will be sent. Use fictional contact information when trying the preview.</div><form id="contact-form" class="contact-form"><label class="form-field">Name<input name="name" required autocomplete="off" placeholder="Your name"></label><label class="form-field">Email<input name="email" type="email" required autocomplete="off" placeholder="name@example.com"></label><label class="form-field">Organisation or building<input name="building" required placeholder="Building name"></label><label class="form-field">Location<input name="location" required placeholder="Town or city"></label><label class="form-field">Approximate apartments<input name="units" required type="number" min="1" step="1" placeholder="20"></label><label class="form-field span-all">Message<textarea name="message" required placeholder="Describe your project"></textarea></label><div class="span-all"><button class="btn" type="submit">Review demo enquiry</button></div></form></div></main>${footer()}`}

function appFrame(content){const rt=route();return `<div class="demo-bar"><span><strong>Demo data</strong> &nbsp; <span>Lindenhof / </span>16 Nov 2026, 14:30 Zurich</span><button data-action="reset">Reset demo</button></div><div class="app-shell"><aside class="sidebar"><a class="brand" href="#/">${iconLogo()}</a><div class="building"><strong>Lindenhof</strong><small>Apartment A-12 / Alex</small></div><nav aria-label="Resident navigation">${navItems.map(([r,l])=>`<a class="${rt===r?'active':''}" href="#${r}" ${rt===r?'aria-current="page"':''}>${l}</a>`).join('')}</nav><a class="back" href="#/">Back to website</a></aside><main id="main-content" class="app-main">${content}</main></div><nav class="mobile-nav" aria-label="Mobile resident navigation">${[['/app','Home'],['/app/chargers','Chargers'],['/app/reservations','Bookings'],['/app/more','More']].map(([r,l])=>`<a href="#${r}" class="${rt===r||(l==='More'&&!['/app','/app/chargers','/app/reservations'].includes(rt))?'active':''}">${l}</a>`).join('')}</nav>`}
const appHead=(title,desc,action='')=>`<div class="app-head"><div><div class="eyebrow" style="margin-bottom:9px">Lindenhof / Apartment A-12</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;
function monthly(){const sessions=state.sessions.filter(s=>s.end.startsWith('2026-11'));const bookings=state.bookings.filter(b=>own(b)&&b.start.startsWith('2026-11'));return {sessions,bookings,kwh:sessions.reduce((a,s)=>a+s.kwh,0),cost:sessions.reduce((a,s)=>a+s.costMinor,0),outstanding:state.invoices.reduce((a,i)=>a+Math.max(0,i.amountMinor-i.paidMinor),0)}}
function availability(charger,start=state.clock,end=new Date(new Date(state.clock).getTime()+60000).toISOString()){const c=state.chargers.find(x=>x.id===charger);if(c.technical==='offline'||c.technical==='unknown')return c.technical;const block=state.bookings.find(b=>b.charger===charger&&live(b)&&overlap(start,end,b.start,b.end));if(block)return c.technical==='charging'&&block.status==='active'?'charging':'reserved';return'available'}
function overview(){const m=monthly(),available=state.chargers.filter(c=>availability(c.id)==='available').length,next=state.bookings.filter(b=>own(b)&&b.status==='upcoming').sort((a,b)=>new Date(a.start)-new Date(b.start))[0];return appFrame(`${appHead('Good afternoon, Alex','Your building and charging at a glance.',`<a class="btn" href="#/app/chargers">Reserve a charger</a>`)}<div class="stats"><article class="stat primary"><small>Available now</small><strong>${available} / 5</strong><div class="note">Parking occupancy unverified</div></article><article class="stat"><small>Completed sessions</small><strong>${m.sessions.length}</strong><div class="note">November 2026</div></article><article class="stat"><small>Energy charged</small><strong>${m.kwh.toFixed(1)} <span style="font-size:17px">kWh</span></strong><div class="note">Measured session total</div></article><article class="stat"><small>Charging cost</small><strong>${money(m.cost)}</strong><div class="note">November / Not yet invoiced</div></article></div><div class="dashboard-grid"><section class="panel"><h2>Your next booking</h2>${next?`<div class="next-booking">${chip('Upcoming')}<div class="when">${dateFmt(next.start)}, ${timeFmt(next.start)} - ${timeFmt(next.end)}</div><p>${next.charger} / Bay ${state.chargers.find(c=>c.id===next.charger).bay} / ${esc(next.vehicleName)}</p><a href="#/app/reservations" class="btn secondary small">View booking</a></div>`:`<div class="empty"><h3>No upcoming bookings</h3><p>Choose a time that works for your household.</p><a class="btn" href="#/app/chargers">Find a charger</a></div>`}<div class="row"><div><strong>${m.bookings.length} bookings this month</strong><small>${m.bookings.filter(b=>b.status==='completed').length} completed / ${m.bookings.filter(b=>b.status==='upcoming').length} upcoming / ${m.bookings.filter(b=>b.status==='cancelled').length} cancelled</small></div><a class="text-link" href="#/app/reservations">View all</a></div></section><section class="panel"><h2>Outstanding invoices</h2>${chip(m.outstanding?'Overdue':'Paid',m.outstanding?'overdue':'paid')}<div class="balance">${money(m.outstanding)}</div><p class="muted" style="font-size:14px">October 2026 / Due 10 November</p><a href="#/app/billing" class="btn secondary small" style="margin-top:24px">View invoice</a><p class="source-note">Unpaid invoices are separate from this month's unbilled charging.</p></section><section class="panel" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;gap:18px"><h2>Charging activity</h2><a href="#/app/activity" class="text-link" style="font-size:14px">View sessions</a></div><p class="muted" style="font-size:13px">Measured energy by completed session, November 2026</p><div class="spending-chart" role="img" aria-label="Eight charging sessions total 112 kilowatt-hours; session values are available in Activity">${m.sessions.map(s=>`<div class="chart-col"><small>${s.kwh}</small><div class="chart-bar" style="height:${s.kwh*4.7}px"></div><div class="chart-label">${dateFmt(s.end)}</div></div>`).join('')}</div></section></div>`)}
function mapInterval(){return showFuture?[`${bookingDate}T${bookingStart}:00+01:00`,`${bookingDate}T${bookingEnd}:00+01:00`]:[state.clock,new Date(new Date(state.clock).getTime()+60000).toISOString()]}
function chargers(){const [s,e]=mapInterval(),c=state.chargers.find(c=>c.id===selectedCharger),status=availability(c.id,s,e);let map='';for(let r=0;r<2;r++){map+='<div class="parking-row">';for(let j=1;j<=10;j++){let bay='P'+String(r*10+j).padStart(2,'0'),ch=state.chargers.find(c=>c.bay===bay);if(ch){let st=availability(ch.id,s,e);map+=`<button class="bay charger ${st} ${selectedCharger===ch.id?'selected':''}" data-charger="${ch.id}" aria-label="${ch.id}, bay ${bay}, ${st}" aria-pressed="${selectedCharger===ch.id}"><strong>${ch.id}</strong><span>${st[0].toUpperCase()+st.slice(1)}</span><span>${bay}</span></button>`}else map+=`<div class="bay"><span>Parking</span><span>${bay}</span></div>`}map+='</div>';if(r===0)map+='<div class="aisle"><span>ENTRY</span><span>DRIVE AISLE</span><span>PEDESTRIAN EXIT</span></div>'}return appFrame(`${appHead('Find a charger','Charger status and reservations. Parking occupancy is unverified.')}<div class="toolbar"><div class="switch" aria-label="Charger view"><button data-action="map" class="${mapMode==='map'?'active':''}" aria-pressed="${mapMode==='map'}">Map</button><button data-action="list" class="${mapMode==='list'?'active':''}" aria-pressed="${mapMode==='list'}">List</button></div><span class="muted" style="font-size:13px">${showFuture?`${dateFmt(s)}, ${bookingStart}-${bookingEnd}`:'Now / Last updated 14:30'}</span>${showFuture?btn('Show now','now','ghost small'):''}</div><div class="charge-layout"><section class="panel"><h2>Garage level 1</h2>${mapMode==='map'?`<div class="map-wrap"><div class="parking">${map}</div></div>`:`<div class="charger-list">${state.chargers.map(ch=>{let st=availability(ch.id,s,e);return `<button class="charger-item ${ch.id===selectedCharger?'selected':''}" data-charger="${ch.id}" aria-pressed="${ch.id===selectedCharger}"><span><strong>${ch.id} / ${ch.bay}</strong><small>Shared charger</small></span>${chip(st[0].toUpperCase()+st.slice(1),st)}</button>`}).join('')}</div>`}<div class="toolbar" style="margin:22px 0 0">${chip('Available')}${chip('Charging')}${chip('Reserved')}${chip('Offline')}</div><p class="map-note">Illustrative plan, 20 parking bays and five chargers. Availability does not verify an empty parking space.</p></section><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px"><h2 style="margin:0">${c.id} / Bay ${c.bay}</h2>${chip(status[0].toUpperCase()+status.slice(1),status)}</div><form id="booking-form"><div class="booking-fields"><label class="form-field full">Date<input id="book-date" type="date" min="2026-11-16" max="2026-11-30" value="${bookingDate}" required></label><label class="form-field">Start time<input id="book-start" type="time" value="${bookingStart}" required></label><label class="form-field">End time<input id="book-end" type="time" value="${bookingEnd}" required></label><label class="form-field full">Vehicle<select id="book-vehicle" required>${state.vehicles.map(v=>`<option value="${v.id}" ${v.id===bookingVehicle?'selected':''}>${esc(v.name)} / ${esc(v.plate)}</option>`).join('')}</select></label></div><div class="actions" style="margin-top:22px"><button class="btn" type="submit" ${!state.vehicles.length?'disabled':''}>Review reservation</button><button class="btn ghost" type="button" data-action="apply-time">Check this time</button></div><div class="form-error" id="booking-error" role="alert"></div></form>${!state.vehicles.length?'<a class="text-link" href="#/app/household">Add a household vehicle first</a>':''}<div class="price-note"><strong style="color:var(--color-ink)">Indicative demo rate: CHF 0.32/kWh</strong><p style="margin-top:10px">CHF 0.28 energy + CHF 0.04 markup. Dynamic pricing, not locked by a reservation. Final cost follows measured energy and tariff intervals.</p><p style="margin-top:10px">November dates only in this preview. This is a demo constraint, not a commercial booking rule.</p></div></section></div>`)}
function reservations(){const ownB=state.bookings.filter(own),up=ownB.filter(b=>b.status==='upcoming').sort((a,b)=>new Date(a.start)-new Date(b.start)),past=ownB.filter(b=>b.status!=='upcoming').sort((a,b)=>new Date(b.start)-new Date(a.start));function table(items,canCancel){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>When</th><th>Charger</th><th>Vehicle</th><th>Status</th><th></th></tr></thead><tbody>${items.map(b=>`<tr><td><strong>${dateFmt(b.start)}</strong><br><small>${timeFmt(b.start)} - ${timeFmt(b.end)}</small></td><td>${b.charger} / ${state.chargers.find(c=>c.id===b.charger).bay}</td><td>${esc(b.vehicleName)}</td><td>${chip(b.status[0].toUpperCase()+b.status.slice(1),b.status)}</td><td>${canCancel?`<button class="btn secondary small" data-cancel="${b.id}">Cancel</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}return appFrame(`${appHead('Your bookings','Reservations scheduled in November, including cancelled bookings.',`<a class="btn" href="#/app/chargers">New booking</a>`)}<section class="panel" style="margin-bottom:24px"><h2>Upcoming</h2>${up.length?table(up,true):'<div class="empty"><h3>No upcoming reservations</h3><p>Find a charger to make your next booking.</p><a class="btn" href="#/app/chargers">Reserve a charger</a></div>'}</section><section class="panel"><h2>History</h2>${table(past,false)}</section>`)}
function activity(){const m=monthly();return appFrame(`${appHead('Charging activity','Completed sessions, measured energy and final demonstration costs.')}<section class="panel"><div class="toolbar"><label class="form-field" style="min-width:190px">Vehicle<select id="activity-vehicle"><option value="all">All vehicles</option>${state.vehicles.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><span id="activity-summary" class="muted" style="font-size:14px">November 2026 / ${m.sessions.length} sessions / ${m.kwh.toFixed(1)} kWh</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Date</th><th>Vehicle</th><th>Charger</th><th class="num">Energy</th><th class="num">Final cost</th></tr></thead><tbody id="activity-rows">${activityRows('all')}</tbody></table></div><p class="source-note">Totals use session end dates in Europe/Zurich. November usage is not yet invoiced. Demo taxes and additional fees are zero for illustration only.</p></section>`)}
function activityRows(v){return state.sessions.filter(s=>v==='all'||s.vehicle===v).slice().reverse().map(s=>`<tr><td>${dateFmt(s.end)} 2026</td><td>${esc(s.vehicleName)}</td><td>${s.charger}</td><td class="num">${s.kwh.toFixed(1)} kWh</td><td class="num"><strong>${money(s.costMinor)}</strong></td></tr>`).join('')||'<tr><td colspan="5">No sessions match this vehicle.</td></tr>'}
function billing(){const m=monthly();return appFrame(`${appHead('Billing','Your household electricity costs and invoices.')}<div class="stats" style="grid-template-columns:repeat(2,1fr)"><article class="stat"><small>November charging cost</small><strong>${money(m.cost)}</strong><div class="note">Unbilled usage / ${m.kwh.toFixed(1)} kWh</div></article><article class="stat"><small>Outstanding invoices</small><strong>${money(m.outstanding)}</strong><div class="note">Across all billing periods</div></article></div><section class="panel"><h2>Invoices</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Due date</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${state.invoices.slice().reverse().map(i=>`<tr><td>${i.period}</td><td>${dateFmt(i.due+'T12:00:00+01:00')} 2026</td><td><strong>${money(i.amountMinor)}</strong></td><td>${chip(i.paidMinor>=i.amountMinor?'Paid':'Overdue')}</td><td><button class="btn secondary small" data-invoice="${i.id}">View invoice</button></td></tr>`).join('')}</tbody></table></div><p class="source-note">Residents pay for electricity. The building's apartment subscription belongs to the owner or property manager's contract and is not added here.</p></section>`)}
function household(){return appFrame(`${appHead('Your household','Apartment A-12. Vehicles and access for the people you live with.',btn('Add vehicle','add-vehicle'))}<div class="dashboard-grid"><section class="panel"><h2>Vehicles</h2><div class="cards">${state.vehicles.map(v=>`<article class="vehicle"><span class="eyebrow">Household vehicle</span><h3>${esc(v.name)}</h3><div class="plate">${esc(v.plate)}</div><div class="actions"><button class="btn secondary small" data-edit-vehicle="${v.id}">Edit</button><button class="btn ghost small" data-remove-vehicle="${v.id}">Remove</button></div></article>`).join('')||'<div class="empty"><h3>No registered vehicles</h3><p>Add a vehicle before making a booking.</p></div>'}</div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 style="margin:0">Members</h2>${btn('Invite','invite-member','secondary small')}</div>${state.members.map(m=>`<div class="row"><div><strong>${esc(m.name)}</strong><small>${esc(m.role)}</small></div>${chip(m.status,m.status==='Active'?'available':'reserved')}</div>`).join('')}<p class="source-note">Alex is the household administrator. Pending demo invitations do not send email.</p></section></div>`)}
function help(){return appFrame(`${appHead('Help and building rules','Clear expectations for shared charging.')}<div class="cards"><section class="panel help-text"><h2>Reservations</h2><p>Choose a future time and a registered vehicle. Overlapping bookings on the same charger or vehicle are rejected.</p><p>A reservation is separate from an active charging session. The real service requires supported app or NFC access.</p><p>Duration limits, cancellations, no-shows and any idle fees remain commercial decisions for the building.</p></section><section class="panel help-text"><h2>Availability and costs</h2><p>The map combines charger condition and bookings. The demo has no parking occupancy sensor.</p><p>A displayed rate is indicative. Dynamic electricity prices and measured energy determine final charges.</p><p>Shared load management means a reserved duration does not guarantee a fixed amount of energy.</p></section><section class="panel help-text"><h2>About this preview</h2><p>This is a local design demonstration using fictional people, vehicles and invoices. The clock is fixed at 16 November 2026, 14:30 Zurich.</p><p>Changes are saved in this browser where local storage is available. Reset demo restores the initial example.</p></section><section class="panel help-text"><h2>Operational integrations</h2><p>Production needs authentication, server permissions, conflict-safe booking storage, charger telemetry and billing integrations.</p><p>No physical charger, email, access card or payment service is connected to this preview.</p><a class="text-link" href="implementation-guide.html">Read the implementation guide</a></section></div>`)}
function more(){return appFrame(`${appHead('More','Manage your household and charging records.')}<div class="list-links">${[['activity','Activity'],['billing','Billing'],['household','Household'],['help','Help']].map(([r,l])=>`<a href="#/app/${r}">${l}<span aria-hidden="true">›</span></a>`).join('')}<a href="#/">Back to website<span aria-hidden="true">›</span></a></div>`)}
function render(){const r=route();let html;switch(r){case'/business-model':html=business();break;case'/contact':html=contact();break;case'/app':case'/demo':case'/login':html=overview();break;case'/app/chargers':html=chargers();break;case'/app/reservations':html=reservations();break;case'/app/activity':html=activity();break;case'/app/billing':html=billing();break;case'/app/household':html=household();break;case'/app/help':html=help();break;case'/app/more':html=more();break;default:html=home();}
$('#view').innerHTML=html;document.title=`VoltoShare | ${r.startsWith('/app')?'Resident demo':r==='/business-model'?'Business model':'Shared charging'}`;
if(['/how-it-works','/for-buildings','/faq'].includes(r)){requestAnimationFrame(()=>document.getElementById(r.slice(1))?.scrollIntoView())}else window.scrollTo(0,0);
}
function modal(title,body){$('#modal').innerHTML=`<button class="modal-close" data-action="close-modal" aria-label="Close dialog">Close</button><h2 id="modal-title">${title}</h2>${body}`;$('#modal').showModal()}
function readBooking(){bookingDate=$('#book-date').value;bookingStart=$('#book-start').value;bookingEnd=$('#book-end').value;bookingVehicle=$('#book-vehicle').value;return {charger:selectedCharger,vehicle:bookingVehicle,start:`${bookingDate}T${bookingStart}:00+01:00`,end:`${bookingDate}T${bookingEnd}:00+01:00`}}
function validateBooking(b){if(!b.vehicle||!state.vehicles.some(v=>v.id===b.vehicle))return'Add or select a household vehicle.';if(!Number.isFinite(+new Date(b.start))||!Number.isFinite(+new Date(b.end)))return'Choose a valid date and time.';if(new Date(b.start)<new Date(state.clock))return'The start time must be at or after the current demo time.';if(new Date(b.end)<=new Date(b.start))return'The end time must be after the start time.';if(['offline','unknown'].includes(state.chargers.find(c=>c.id===b.charger)?.technical))return'This charger is offline or its status is unknown. Choose another charger.';if(state.bookings.some(x=>live(x)&&x.charger===b.charger&&overlap(b.start,b.end,x.start,x.end)))return'This charger is already reserved for part of your chosen time.';if(state.bookings.some(x=>own(x)&&live(x)&&x.vehicle===b.vehicle&&overlap(b.start,b.end,x.start,x.end)))return'This vehicle already has an overlapping booking. Choose another time or vehicle.';return''}
function reviewBooking(){draft=readBooking();const error=validateBooking(draft);if(error){$('#booking-error').textContent=error;return}const v=state.vehicles.find(v=>v.id===draft.vehicle),c=state.chargers.find(c=>c.id===draft.charger);modal('Review your reservation',`<div class="notice">Demo only. No physical charger will be reserved.</div><dl><dt>Charger</dt><dd>${c.id} / Bay ${c.bay}</dd><dt>Time in Europe/Zurich</dt><dd>${dateFmt(draft.start)} 2026, ${timeFmt(draft.start)} - ${timeFmt(draft.end)}</dd><dt>Vehicle</dt><dd>${esc(v.name)} / ${esc(v.plate)}</dd><dt>Indicative dynamic rate</dt><dd>CHF 0.32/kWh</dd></dl><p class="muted" style="font-size:13px">CHF 0.28 energy + CHF 0.04 markup. No fixed energy amount is guaranteed. Demo taxes and extra fees are zero.</p><div id="confirm-error" class="form-error" role="alert"></div><div class="actions">${btn('Confirm demo booking','confirm-booking')}${btn('Back','close-modal','secondary')}</div>`)}
function vehicleModal(id){const v=state.vehicles.find(v=>v.id===id)||{name:'',plate:''};modal(id?'Edit vehicle':'Register a vehicle',`<form id="vehicle-form" data-id="${id||''}"><div class="booking-fields"><label class="form-field full">Vehicle name<input name="name" required maxlength="40" value="${esc(v.name)}" placeholder="City EV"></label><label class="form-field full">Registration identifier<input name="plate" required maxlength="20" value="${esc(v.plate)}" placeholder="DEMO003"></label></div><div class="form-error" id="vehicle-error" role="alert"></div><div class="actions"><button type="submit" class="btn">Save vehicle</button>${btn('Cancel','close-modal','secondary')}</div></form>`)}
function calculate(){const u=Number($('#units').value),o=Number($('#occupied').value),input=$('#rate').value,rate=Number(input),pause=$('#vacancy').value==='pause';if(!Number.isInteger(u)||!Number.isInteger(o)||u<0||o<0||o>u){$('#calc-result').innerHTML='<p role="alert" style="color:var(--color-danger)">Occupied apartments must be a whole number between zero and contracted apartments.</p>';return}if(input===''||!Number.isFinite(rate)||rate<0){$('#calc-result').innerHTML='<p class="muted">Enter a non-negative rate to see illustrative monthly subscription revenue.</p>';return}const units=pause?o:u;$('#calc-result').innerHTML=`<small>Illustrative monthly subscription revenue</small><p><strong>${money(Math.round(units*rate*100))}</strong></p><p class="muted" style="font-size:14px;margin-top:10px">${units} billable apartments × CHF ${rate.toFixed(2)} per month. Costs have not been deducted.</p>`}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.charger){if($('#book-date'))readBooking();selectedCharger=t.dataset.charger;render();return}
if(t.dataset.cancel){const b=state.bookings.find(x=>x.id===t.dataset.cancel);modal('Cancel this booking?',`<p>${b.charger}, ${dateFmt(b.start)}, ${timeFmt(b.start)}-${timeFmt(b.end)}, ${esc(b.vehicleName)}.</p><p class="muted" style="margin-top:12px">This releases the slot in the local demo.</p><div class="actions"><button class="btn danger" data-confirm-cancel="${b.id}">Cancel booking</button>${btn('Keep booking','close-modal','secondary')}</div>`);return}
if(t.dataset.confirmCancel){state.bookings.find(b=>b.id===t.dataset.confirmCancel).status='cancelled';persist();$('#modal').close();render();toast('Booking cancelled. The demo slot is available again.');return}
if(t.dataset.editVehicle){vehicleModal(t.dataset.editVehicle);return}
if(t.dataset.removeVehicle){const v=state.vehicles.find(v=>v.id===t.dataset.removeVehicle);if(state.bookings.some(b=>own(b)&&live(b)&&b.vehicle===v.id)){modal('Vehicle has an upcoming booking',`<p>Cancel or reassign the upcoming reservation before removing ${esc(v.name)}.</p><div class="actions">${btn('Close','close-modal','secondary')}</div>`)}else modal('Remove this vehicle?',`<p>${esc(v.name)} / ${esc(v.plate)}. Historical charging records will remain.</p><div class="actions"><button class="btn danger" data-confirm-remove="${v.id}">Remove vehicle</button>${btn('Keep vehicle','close-modal','secondary')}</div>`);return}
if(t.dataset.confirmRemove){state.vehicles=state.vehicles.filter(v=>v.id!==t.dataset.confirmRemove);if(bookingVehicle===t.dataset.confirmRemove)bookingVehicle=state.vehicles[0]?.id||'';persist();$('#modal').close();render();toast('Vehicle removed. Historical records retained.');return}
if(t.dataset.invoice){const i=state.invoices.find(i=>i.id===t.dataset.invoice);modal('Electricity invoice',`<div class="notice">DEMO INVOICE / No payment is requested by this preview.</div><dl><dt>Reference</dt><dd>${i.id}</dd><dt>Household and period</dt><dd>A-12 / ${i.period}</dd><dt>Invoice total</dt><dd>${money(i.amountMinor)}</dd><dt>Paid</dt><dd>${money(i.paidMinor)}</dd><dt>Remaining balance</dt><dd>${money(Math.max(0,i.amountMinor-i.paidMinor))}</dd><dt>Due date</dt><dd>${dateFmt(i.due+'T12:00:00+01:00')} 2026</dd></dl><p class="muted" style="font-size:13px">This prior-period invoice is a standalone sample record. Detailed meter line items are not included in this example.</p><div class="actions">${btn('Print or save as PDF','print-invoice','secondary')}${btn('Close','close-modal','secondary')}</div>`);return}
switch(t.dataset.action){case'close-modal':$('#modal').close();break;case'print-invoice':window.print();break;case'map':readBooking();mapMode='map';render();break;case'list':readBooking();mapMode='list';render();break;case'now':readBooking();showFuture=false;render();break;case'apply-time':{const b=readBooking();if(new Date(b.end)<=new Date(b.start)){$('#booking-error').textContent='Choose an end time after the start time.';break}showFuture=true;render();break}case'confirm-booking':{const err=validateBooking(draft);if(err){$('#confirm-error').textContent=err;break}const v=state.vehicles.find(x=>x.id===draft.vehicle);state.bookings.push({...draft,id:'B'+Date.now().toString(36).toUpperCase(),household:'A-12',vehicleName:v.name,status:'upcoming'});persist();$('#modal').close();go('/app/reservations');toast('Demo booking confirmed.');break}case'add-vehicle':vehicleModal();break;case'invite-member':modal('Invite a household member',`<div class="notice">Demo invitation. No email will be sent.</div><form id="invite-form" style="margin-top:22px"><label class="form-field">Name<input name="name" required maxlength="40" placeholder="Member name"></label><label class="form-field" style="margin-top:16px">Email<input name="email" required type="email" placeholder="name@example.com"></label><div class="actions"><button class="btn" type="submit">Create demo invitation</button>${btn('Cancel','close-modal','secondary')}</div></form>`);break;case'reset':modal('Reset the resident demo?',`<p>This restores the original sample bookings, vehicles, household and invoices in this browser.</p><div class="actions">${btn('Reset demo','confirm-reset')}${btn('Keep changes','close-modal','secondary')}</div>`);break;case'confirm-reset':state=structuredClone(BASE);persist();$('#modal').close();bookingVehicle='city';selectedCharger='C01';bookingDate='2026-11-17';bookingStart='18:00';bookingEnd='20:00';showFuture=false;render();toast('Demo restored to its original sample data.');break;}
});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(f.id==='booking-form'){reviewBooking();return}if(f.id==='vehicle-form'){const data=new FormData(f),name=String(data.get('name')).trim(),plate=String(data.get('plate')).trim().toUpperCase();if(!name||!plate){$('#vehicle-error').textContent='Enter a vehicle name and registration.';return}if(state.vehicles.some(v=>v.plate===plate&&v.id!==f.dataset.id)){$('#vehicle-error').textContent='This registration is already in your household.';return}if(f.dataset.id){const v=state.vehicles.find(v=>v.id===f.dataset.id);v.name=name;v.plate=plate;state.bookings.filter(b=>b.vehicle===v.id&&b.status==='upcoming').forEach(b=>b.vehicleName=name)}else state.vehicles.push({id:'v'+Date.now().toString(36),name,plate});persist();$('#modal').close();render();toast('Vehicle saved.');return}if(f.id==='invite-form'){const data=new FormData(f);state.members.push({id:'m'+Date.now().toString(36),name:String(data.get('name')).trim(),role:'Member',status:'Pending'});persist();$('#modal').close();render();toast('Demo invitation created. No email was sent.');return}if(f.id==='contact-form'){const d=Object.fromEntries(new FormData(f));modal('Review your demo enquiry',`<div class="notice">No message has been sent.</div><dl><dt>Name</dt><dd>${esc(d.name)}</dd><dt>Email</dt><dd>${esc(d.email)}</dd><dt>Building</dt><dd>${esc(d.building)} / ${esc(d.location)}</dd><dt>Apartments</dt><dd>${esc(d.units)}</dd></dl><p>${esc(d.message)}</p><div class="actions">${btn('Close preview','close-modal','secondary')}</div>`);return}});
document.addEventListener('input',e=>{if(['units','occupied','rate'].includes(e.target.id))calculate()});
document.addEventListener('change',e=>{if(e.target.id==='vacancy')calculate();if(e.target.id==='activity-vehicle'){const sessions=state.sessions.filter(s=>e.target.value==='all'||s.vehicle===e.target.value);$('#activity-rows').innerHTML=activityRows(e.target.value);$('#activity-summary').textContent=`November 2026 / ${sessions.length} sessions / ${sessions.reduce((sum,s)=>sum+s.kwh,0).toFixed(1)} kWh`}});
window.addEventListener('hashchange',render);render();
</script>
</body></html>
