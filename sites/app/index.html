<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9">
  <meta name="color-scheme" content="light">
  <meta name="description" content="VoltoShare web app placeholder. Coming soon.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="application-name" content="VoltoShare">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VoltoShare">
  <title>VoltoShare — Web app</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #fafaf9; color: #292524; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 28rem; }
    .label { margin: 0 0 1rem; color: #57534e; font-size: 0.875rem; line-height: 1.5; }
    h1 { margin: 0; font-size: clamp(2.25rem, 9vw, 3.5rem); font-weight: 600; letter-spacing: -0.045em; line-height: 1.15; overflow-wrap: anywhere; }
    .status { margin: 1rem 0 0; color: #57534e; font-size: 1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <p class="label">Web app placeholder</p>
    <h1>VoltoShare</h1>
    <p class="status">Coming soon.</p>
  </main>
</body>
</html>
